# Gold baseline families. build-all builds one baseline per family and registers it in index.yaml.
#   min_share: a validation is "core" when at least this share of the family's branches has it
#              (1 = every branch; 0.75 = 3 of 4). Lower it only while branches are being aligned.
#   scope:     family (same domain family + version) or hub (all domains of a hub - used when no family fits)
#   approved_by: fill in when the baseline has been reviewed - it is then the gold standard for CI.
# Active: FIS12@2.3.0 only (one domain for now). Uncomment a family to switch it on.
families:
  # ── Financial services ──
  - name: FIS12@2.3.0
    branches: [draft-FIS12-2.3.0, draft-FIS12BL-2.3.0, draft-FIS12SL-2.3.0, draft-FIS12-PF-2.3.0]
    min_share: 0.75
